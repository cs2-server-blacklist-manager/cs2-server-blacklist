name: Release
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Release
        env:
          GH_TOKEN: ${{github.token}}
        run: |
          gh release create v${{github.run_number}} ./cs2-server-blacklist-updates.ps1 ./cs2-server-blacklist-disable.ps1 ./cs2-server-blacklist-disable.ps1 --prerelease
